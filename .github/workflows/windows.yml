name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared parity checks
        run: python scripts/check-parity.py
      - name: Core tests (shared vectors with macOS)
        run: dotnet test windows/tests/Mica.Core.Tests/Mica.Core.Tests.csproj -c Release
      - name: Build app and setup
        shell: pwsh
        run: windows/scripts/build.ps1 -Arch ${{ matrix.arch }} -SkipTests
      - name: Setup starts (WinUI single-file)
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows/artifacts -Filter 'mica-*-win-${{ matrix.arch }}-setup.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'setup did not exit' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$env:TEMP\mica-setup-self-test.log") { Get-Content "$env:TEMP\mica-setup-self-test.log" }
            Get-ChildItem windows/artifacts/setup-${{ matrix.arch }} -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            Get-ChildItem "$env:TEMP\.net" -Recurse -Filter '*.pri' -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            $original = Start-Process windows/artifacts/setup-${{ matrix.arch }}/mica-setup.exe -ArgumentList '--self-test' -PassThru
            if (-not $original.WaitForExit(60000)) { $original.Kill() }
            Write-Host "Original setup exit code: $($original.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } |
              Select-Object -First 10 | Format-List TimeCreated, ProviderName, Message
            throw "setup exit code $($p.ExitCode)"
          }
      - name: Quiet install and smoke test with real WebView2
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows/artifacts -Filter 'mica-*-win-${{ matrix.arch }}-setup.exe' | Select-Object -First 1
          $install = Start-Process $setup.FullName -ArgumentList '--quiet' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "setup exit code $($install.ExitCode)" }
          windows/scripts/smoke.ps1
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.arch }}
          path: ~/AppData/Local/mica/QA/smoke-report.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: mica-windows-${{ matrix.arch }}
          path: |
            windows/artifacts/mica-*-setup.exe
            windows/artifacts/mica-*-setup.exe.sha256
      - name: Attach to release
        if: false
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem windows/artifacts -Filter 'mica-*-setup.exe*').FullName --clobber
